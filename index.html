<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Platter × TVS — section screenshots</title>
<style>
  body { margin: 0 auto; max-width: 1200px; padding: 24px; font-family: system-ui, sans-serif; color: #1a1a1a; }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; margin-top: 40px; }
  figure { margin: 16px 0; }
  figcaption { font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  figcaption a { color: #0458ad; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; text-decoration: none; word-break: break-all; }
  figcaption a:hover { text-decoration: underline; }
  figcaption button { font: inherit; font-size: 12px; padding: 2px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; cursor: pointer; }
  figcaption button:hover { background: #f3f4f6; }
  img { max-width: 100%; height: auto; border: 1px solid #e5e7eb; border-radius: 4px; }
</style>
<script>
  function copyUrl(button) {
    navigator.clipboard.writeText(button.dataset.url).then(() => {
      button.textContent = "copied";
      setTimeout(() => { button.textContent = "copy"; }, 1200);
    });
  }
</script>
</head>
<body>
<h1>Platter × TVS — section screenshots</h1>
<p>Generated by <code>pnpm shots</code>. Captured at 2x — a 1512px capture is 3024 image pixels wide.</p>
